name: Fork nightly

# Builds the newest upstream nightly with this fork's commits on top, and
# publishes it here so the desktop app's update button installs it.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build the newest upstream nightly again and replace this fork's release of it.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-nightly

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find an upstream nightly this fork has not built
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          tag="$(gh release list -R pingdotgg/t3code --exclude-drafts --limit 30 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))][0] // ""')"
          if [ -z "$tag" ]; then
            echo "No upstream nightly release found." >&2
            exit 1
          fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$REBUILD" != "true" ]; then
            echo "$tag is already released here."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.tag != ''
    strategy:
      matrix:
        include:
          - platform: mac
            # The Apple Speech helper needs Xcode 26, the default here.
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Put the fork's commits on the upstream nightly
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main "refs/tags/$TAG:refs/upstream-nightly"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Translation catalogs are generated: keep upstream's and generate them again below.
          echo 'apps/web/src/i18n/translations/*.json merge=keep-current' >> .git/info/attributes
          git config merge.keep-current.driver true
          if ! git merge-base --is-ancestor "$(git merge-base upstream/main HEAD)" refs/upstream-nightly; then
            echo "The fork includes upstream changes newer than $TAG." >&2
            exit 1
          fi
          git checkout --detach refs/upstream-nightly
          git merge --no-edit "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/notes"
          git log --no-merges --format='- %s' refs/upstream-nightly..HEAD -- . \
            ':(exclude).github/workflows/fork-nightly.yml' > "$RUNNER_TEMP/notes/fork-commits.md"

      - uses: ./.github/actions/setup-ci-deps

      - name: Generate the translation catalogs
        run: |
          (cd apps/web && vp run i18n:generate)
          node scripts/i18n-check.ts

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Build the signed macOS app
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "Set the CSC_LINK and CSC_KEY_PASSWORD secrets. Unsigned builds cannot update in place." >&2
            exit 1
          fi
          # The public T3 Connect identifiers, as upstream preview builds use them.
          eval "$(grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example | sed 's/^/export /')"
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 \
            --signed --build-version "${TAG#v}"
          # An ad-hoc signature has no Authority, and the installed app refuses it as an update.
          ditto -x -k release/*.zip "$RUNNER_TEMP/app"
          codesign --verify --deep --strict "$RUNNER_TEMP"/app/*.app
          codesign -dvv "$RUNNER_TEMP"/app/*.app 2>&1 | grep -m1 "^Authority="

      # Machines that run the t3 CLI server install this archive and update from it.
      - name: Build the CLI archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ "$PLATFORM" = linux ]; then
            arch=x64 key=linux-x64 rust_target=x86_64-unknown-linux-gnu
            # The archive ships libatomic.so.1 and points t3's RUNPATH at it.
            sudo apt-get update
            sudo apt-get install -y patchelf
          else
            # Without a Developer ID identity the binary is signed ad hoc, which t3's own installer accepts.
            arch=arm64 key=darwin-arm64 rust_target=aarch64-apple-darwin
          fi
          eval "$(grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example | sed 's/^/export /')"
          node scripts/update-release-package-versions.ts "$version"
          vp run --filter t3 build
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml \
            --target "$rust_target"
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/$key"
          cp "native/resource-monitor/target/$rust_target/release/t3-resource-monitor" \
            "$RUNNER_TEMP/cli-resource-monitor/$key/"
          node scripts/build-cli-archive.ts --platform "$PLATFORM" --arch "$arch" --version "$version" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release
          node scripts/smoke-cli-archive.ts --archive release/t3-*.tar.gz --expect-version "$version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/nightly-*.yml
            release/t3-*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'mac'
        with:
          name: notes
          path: ${{ runner.temp }}/notes/fork-commits.md

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upstream's notes come first and unchanged, so the update dialog shows them as upstream does.
          {
            gh release view "$TAG" -R pingdotgg/t3code --json body --jq .body
            echo
            echo "## Fork commits"
            echo
            echo "Added on top of upstream [\`$TAG\`](https://github.com/pingdotgg/t3code/releases/tag/$TAG):"
            echo
            cat notes/fork-commits.md
          } > "$RUNNER_TEMP/notes.md"
          # The CLI installer verifies its archive against this file.
          (cd release && sha256sum t3-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          # A rebuild replaces the release, so its tag must point at this run's commit.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "T3 Code Nightly ${TAG#v} (fork)" --notes-file "$RUNNER_TEMP/notes.md" \
            release/*
